name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run regression tests
        run: bash tests/run.sh
