<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Brother Bridge</title>
  <style>
    :root{color-scheme:dark;--bg:#08111f;--panel:#111d2e;--panel2:#17263a;--text:#eff6ff;--muted:#8fa5bd;--line:#263951;--accent:#5eead4;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;--shadow:0 18px 55px #02061766}
    *{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 10% 0,#12304a 0,transparent 32%),var(--bg);color:var(--text);min-height:100vh}.wrap{width:min(1120px,calc(100% - 32px));margin:auto;padding:42px 0 60px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}h1{font-size:clamp(27px,5vw,46px);line-height:1.05;margin:0;letter-spacing:-.04em}header p{color:var(--muted);margin:9px 0 0}.version{border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 3;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.wide{grid-column:span 7}.services{grid-column:span 5}.failure-detail{grid-column:span 12;border-color:#713044;background:linear-gradient(145deg,#321827,var(--panel))}.failure-detail[hidden]{display:none}.failure-detail strong{display:block;margin:9px 0 4px;color:#fecdd3}.failure-detail p{margin:0;color:#fda4af;overflow-wrap:anywhere}.failure-detail time{color:var(--muted);font-size:13px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.11em}.value{font-size:32px;font-weight:750;margin-top:8px;letter-spacing:-.04em}.unit{font-size:14px;color:var(--muted);font-weight:500}.status-list,.history{list-style:none;padding:0;margin:14px 0 0}.status-list li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;background:var(--bad);box-shadow:0 0 14px currentColor}.dot.ok{background:var(--ok)}.history li{display:grid;grid-template-columns:150px 1fr auto;gap:16px;padding:13px 0;border-top:1px solid var(--line);align-items:center}.history time,.empty{color:var(--muted)}.event{font-weight:650}.pill{font-size:12px;border-radius:999px;padding:4px 9px;background:#20344d;color:#bdd0e4}.pill.good{background:#123c32;color:#86efac}.pill.bad{background:#4a1e2b;color:#fda4af}.foot{display:flex;justify-content:space-between;margin-top:18px;color:var(--muted);font-size:12px}.error{border-color:#713044;color:#fecdd3}@media(max-width:800px){.card,.wide,.services{grid-column:span 12}.history li{grid-template-columns:1fr auto}.history time{grid-column:1/-1}header{align-items:flex-start;flex-direction:column}}@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#eef5fa;--panel:#fff;--panel2:#f7fbfd;--text:#102235;--muted:#61758b;--line:#dbe6ee;--shadow:0 18px 55px #53718b1a}.pill{background:#e4eef6;color:#344b61}}
  </style>
</head>
<body><main class="wrap">
  <header><div><h1>Brother Bridge</h1><p>Scanner to Paperless-ngx · live delivery status</p></div><span class="version" id="version">loading…</span></header>
  <section class="grid">
    <article class="card"><div class="label">Successful</div><div class="value" id="successful">—</div></article>
    <article class="card"><div class="label">Failed</div><div class="value" id="failed">—</div></article>
    <article class="card"><div class="label">Queued</div><div class="value" id="queued">—</div></article>
    <article class="card"><div class="label">Average processing</div><div class="value"><span id="average">—</span> <span class="unit">sec</span></div></article>
    <article class="card failure-detail" id="failureDetail" hidden><div class="label">Last failure</div><strong id="failurePhase"></strong><p id="failureMessage"></p><time id="failureTime"></time></article>
    <article class="card services"><div class="label">Services</div><ul class="status-list" id="services"></ul></article>
    <article class="card wide"><div class="label">Recent activity</div><ul class="history" id="history"><li class="empty">No events recorded yet.</li></ul></article>
  </section>
  <div class="foot"><span id="updated">Not updated yet</span><span>Refreshes every 10 seconds</span></div>
</main><script>
const names={scanner:'Scanner',paperless:'Paperless-ngx',button_service:'Brother button service',queue_worker:'Queue worker'};
const events={scan_queued:'Scan queued',processing_succeeded:'Delivered',processing_failed:'Processing failed',upload_failed:'Upload failed',processing_pending:'Processing pending',scan_failed:'Scan failed'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatTime=v=>new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(v));
const formatUptime=s=>s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h';
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();
  version.textContent='v'+d.version+' · up '+formatUptime(d.uptime_seconds);successful.textContent=d.statistics.successful;failed.textContent=d.statistics.failed;queued.textContent=d.queue.documents;average.textContent=d.statistics.average_processing_seconds??'—';
  if(d.last_failure){failureDetail.hidden=false;failurePhase.textContent=events[d.last_failure.event]||d.last_failure.event;failureMessage.textContent=d.last_failure.detail||'No additional details were reported.';failureTime.textContent=formatTime(d.last_failure.timestamp)}else{failureDetail.hidden=true}
  services.innerHTML=Object.entries(d.services).map(([key,ok])=>`<li><span>${esc(names[key]||key)}</span><span><i class="dot ${ok?'ok':''}"></i>${ok?'Online':'Offline'}</span></li>`).join('');
  history.innerHTML=d.history.length?d.history.map(e=>{const good=e.event==='processing_succeeded',bad=e.event.includes('failed');const extra=e.document_id?`Document ${esc(e.document_id)}`:e.detail?esc(e.detail):'';return `<li><time>${formatTime(e.timestamp)}</time><span class="event">${esc(events[e.event]||e.event)}</span><span class="pill ${good?'good':bad?'bad':''}">${extra||'Bridge'}</span></li>`}).join(''):'<li class="empty">No events recorded yet.</li>';
  updated.textContent='Updated '+new Date().toLocaleTimeString();document.body.classList.remove('error');
}catch(e){updated.textContent='Dashboard connection lost';document.body.classList.add('error')}}refresh();setInterval(refresh,10000);
</script></body></html>
