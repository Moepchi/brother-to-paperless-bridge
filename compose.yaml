services:
  brother-bridge:
    image: moepchi/brother-to-paperless-bridge:latest
    container_name: brother-bridge
    restart: unless-stopped
    network_mode: host
    privileged: true

    volumes:
      # Mapping local driver and certificate files into the container
      - ./brscan-skey-0.3.5-0.amd64.deb:/tmp/skey.deb:ro
      # Only required if you use a self-signed SSL certificate for Paperless-ngx
      - ./rootCA.crt:/usr/local/share/ca-certificates/rootCA.crt:ro

    environment:
      # Variables loaded from your .env file
      BRSCAN_IP: "${BRSCAN_IP}"
      PAPERLESS_URL: "${PAPERLESS_URL}"
      PAPERLESS_TOKEN: "${PAPERLESS_TOKEN}"
      SCAN_PC_NAME: "${SCAN_PC_NAME}"
      AIRSANE_PORT: "${AIRSANE_PORT}"
      
      # The scan script triggered by the scanner's hardware button
      SCAN_SCRIPT: |-
        #!/bin/bash
        # Auto-detecting the scanner device
        DEVICE=$$(scanimage -L | grep -o "brother4:[^ ']*" | sed "s/['\\\`]//g" | head -n 1)

        if [ -z "$$DEVICE" ]; then
          echo "ERROR: No scanner device found!"
          exit 1
        fi

        TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
        TMP_DIR="/tmp/scan_$${TIMESTAMP}"
        mkdir -p "$$TMP_DIR"

        echo "Starting batch scan from [$$DEVICE]..."
        scanimage --device "$$DEVICE" --mode "Gray" --resolution 300 --format=tiff --batch="$$TMP_DIR/page%d.tiff"

        if [ "$$(ls -A "$$TMP_DIR")" ]; then
          FINAL_FILE="/tmp/scan_$${TIMESTAMP}_final.tiff"
          echo "Merging pages into a single document..."
          tiffcp "$$TMP_DIR"/*.tiff "$$FINAL_FILE"

          echo "Uploading document to Paperless-ngx..."
          curl -H "Authorization: Token $$PAPERLESS_TOKEN" \
               -F "document=@$$FINAL_FILE" \
               "$$PAPERLESS_URL/api/documents/post_document/"

          rm -rf "$$TMP_DIR" "$$FINAL_FILE"
        else
          echo "Scan canceled or no pages in feeder."
          rm -rf "$$TMP_DIR"
        fi

    command:
      - |
        # 1. Install the provided Skey tool
        dpkg -i /tmp/skey.deb || apt-get install -f -y
        update-ca-certificates

        # 2. Set up scripts for the Brother scan button
        mkdir -p /opt/brother/scanner/brscan-skey/script/
        echo "$$SCAN_SCRIPT" > /opt/brother/scanner/brscan-skey/script/scantoimage.sh
        chmod +x /opt/brother/scanner/brscan-skey/script/scantoimage.sh
        # Create version-specific link for brscan-skey compatibility
        cp /opt/brother/scanner/brscan-skey/script/scantoimage.sh /opt/brother/scanner/brscan-skey/script/scantoimage-0.3.5-0.sh

        # 3. Register the scanner in the driver
        brsaneconfig4 -r Brother_Scanner || true
        brsaneconfig4 -a name=Brother_Scanner model=MFC-7360N ip="$$BRSCAN_IP"

        # 4. Start background services for network discovery (mDNS/Avahi)
        mkdir -p /var/run/dbus && rm -f /var/run/dbus/pid && dbus-daemon --system --fork
        avahi-daemon -D
        sleep 2
        
        # 5. Register the PC name on the scanner's display (from .env)
        echo "Registering PC name at scanner: $$SCAN_PC_NAME"
        brscan-skey -u "$$SCAN_PC_NAME"
        brscan-skey -r

        echo "SYSTEM READY! AirSane is listening on port: $$AIRSANE_PORT"
        # 6. Start AirSane with the port defined in .env
        exec /usr/local/bin/airsaned --listen-port="$$AIRSANE_PORT" --access-log=-