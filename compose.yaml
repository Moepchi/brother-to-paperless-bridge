services:
  brother-bridge:
    build: .
    image: "${BRIDGE_IMAGE:-brother-to-paperless-bridge:local}"
    container_name: brother-bridge
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/lib/brother-bridge/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    network_mode: host

    volumes:
      # Mapping the local driver and optional custom certificates
      - ./brscan-skey-0.3.5-0.amd64.deb:/tmp/skey.deb:ro
      - ./certs:/usr/local/share/ca-certificates:ro
      # Persistent safety queue: failed uploads survive container restarts
      - scan-queue:/var/lib/brother-bridge/queue

    environment:
      # Variables loaded from your .env file
      BRSCAN_IP: "${BRSCAN_IP}"
      SCANNER_NAME: "${SCANNER_NAME:-Brother_Scanner}"
      SCANNER_MODEL: "${SCANNER_MODEL:-MFC-7360N}"
      BRSCAN_SKEY_SHA256: "${BRSCAN_SKEY_SHA256:-cda25534ea8e3018e7d46b970cb08b36084355adedc933aba0c8c7d03e903db9}"
      PAPERLESS_URL: "${PAPERLESS_URL}"
      PAPERLESS_TOKEN: "${PAPERLESS_TOKEN}"
      SCAN_PC_NAME: "${SCAN_PC_NAME}"
      AIRSANE_PORT: "${AIRSANE_PORT}"
      AIRSANE_DEBUG: "${AIRSANE_DEBUG:-false}"
      SCAN_DEVICE: "${SCAN_DEVICE:-}"
      SCAN_RESOLUTION: "${SCAN_RESOLUTION:-100}"
      SCAN_SOURCE: "${SCAN_SOURCE:-FB}"
      SCAN_SIZE: "${SCAN_SIZE:-A4}"
      SCAN_DUPLEX: "${SCAN_DUPLEX:-false}"
      UPLOAD_RETRIES: "${UPLOAD_RETRIES:-3}"
      UPLOAD_LOCK_TIMEOUT: "${UPLOAD_LOCK_TIMEOUT:-330}"
      PAPERLESS_TASK_TIMEOUT: "${PAPERLESS_TASK_TIMEOUT:-300}"
      PAPERLESS_TASK_POLL_INTERVAL: "${PAPERLESS_TASK_POLL_INTERVAL:-5}"
      QUEUE_RETRY_INTERVAL: "${QUEUE_RETRY_INTERVAL:-60}"
      SANE_ONLY_BROTHER4: "${SANE_ONLY_BROTHER4:-true}"

volumes:
  scan-queue:
